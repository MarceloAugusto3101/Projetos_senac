<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Topo">
     <div>
        <header>
            <h1>Sistema de Cadastro de Produtos</h1>
        </header>
      </div>
    <div>
        <nav>
            <a href="#">Inicio</a>
        </nav>
    </div>
    </div> <br>
    <main>
        <div class="container">
            <label for="">Nome do produto</label> <br>
            <input type="text" name="" id="Nomedoproduto" placeholder="Nome do produto"> <br>
            <label for="">Preço do produto</label> <br>
            <input type="number" name="" id="preçodoproduto" placeholder="Preço do produto"><br>
            <button class="button-17" onclick="cadastrarProduto()">Cadastrar</button>   <br>
            <p id="mensagem"></p>
            <div>
                <h2>Produtos cadastrados</h2>
                <ul id="listaProdutos"></ul>
                <p id="quantidade"></p>
            </div>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
